    '11':
      'description': 'Single-Line Power Technology enables both data and power to be transmitted simultaneously through a single Ethernet cable, significantly simplifying industrial network deployment. By reducing the need for separate power wiring, this approach improves installation efficiency, enhances system reliability, and lowers overall maintenance costs. It is particularly well suited for modern industrial environments where space, scalability, and operational stability are critical, providing a streamlined and robust solution for powering connected devices across the network.'
      'fullWidth': true  # K · true | false
      'jcr:primaryType': 'mgnl:component'
      'mgnl:template': 'advantech-templates:components/cmpConceptIntro/cmpConceptIntro'
