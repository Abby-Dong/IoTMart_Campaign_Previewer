<style>
/* Tokens extracted 2026-09-22 from computed styles + :root custom properties on
   https://iotmart-test.advantech.com/en-eu/campaign-template-test */
:root{
  --gray90:#434447; --ink-bg:#0C0C0C; --gray80:#434447; --gray70:#737B7D; --gray60:#B6BFC1; --gray50:#CFD2D5; --gray40:#E8ECEF; --gray30:#F6F7F9; --white:#FFFFFF;
  --primary:#F39800; --primary-d:#E57B03; --primary70:#F7C265; --primary50:#FBE0B2; --primary30:#FDEACC; --primary10:#FAF3E6;
  --brand:#004280; --brand-d:#003160; --brand75:#336899; --brand50:#80A0BF; --brand30:#DFEBF7;
  --error:#DB3A3A; --error-d:#B52F2F; --error-l:#FFEEEE;
  --success:#00893A; --success-d:#025324; --success-l:#D0E6D4;
  --link:#006EFF; --link-300:#66b3ff; --link-700:#0056cc; --bg-dark:#000540; --panel1:#000540; --panel2:#006EFF; --coll1:#0056cc; --coll2:#66b3ff; --navy-acc:#000540;
  --font:'Heebo',Arial,sans-serif;
  --maxw:1600px; --sec-pad:36px 64px; --banner-pad:24px 64px;
  --ui-bg:#FFFFFF; --ui-text:var(--gray90); --ui-border:var(--gray50); --app-bg:var(--gray30);
  font-family:var(--font);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --ui-bg:#16191C; --ui-text:#EDEEEF; --ui-border:#30353A; --app-bg:#0E1011; } }
:root[data-theme="dark"]{ --ui-bg:#16191C; --ui-text:#EDEEEF; --ui-border:#30353A; --app-bg:#0E1011; }
/* Page-level accent theme (approximated from reference screenshots; blue is production-verified) */
#viewport-frame[data-accent="purple"]{ --link:#8c52f0; --link-300:#b794f6; --link-700:#5b21b6; --bg-dark:#2d1a4d; --panel1:#2d1a4d; --panel2:#8c52f0; --coll1:#5b21b6; --coll2:#b794f6; --navy-acc:#2d1a4d; }
#viewport-frame[data-accent="green"]{ --link:#28a745; --link-300:#7dd87f; --link-700:#1e7e34; --bg-dark:#1a4d1a; --panel1:#1a4d1a; --panel2:#28a745; --coll1:#1e7e34; --coll2:#7dd87f; --navy-acc:#1a4d1a; }
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--app-bg); color:var(--gray90); padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
a{color:inherit; text-decoration:none;}
img{max-width:100%; display:block;}
button{font-family:inherit;}
.svgi{width:1em; height:1em; display:inline-block; vertical-align:-0.15em; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}

/* ================= Starter ================= */
#stage-starter{min-height:100vh; display:grid; grid-template-columns:minmax(300px,460px) minmax(420px,1fr); background:#f6f8fb; color:#17202a;}
.starter-panel{padding:40px clamp(28px,5vw,72px); background:#fff; display:flex; flex-direction:column; justify-content:center; border-right:1px solid #dbe3ec;}
.starter-preview{padding:48px; display:flex; align-items:center; justify-content:center; background:radial-gradient(circle at 20% 20%,#fff 0,#eef4fa 48%,#e4edf6 100%);}
.starter-brand{font-size:13px; font-weight:700; color:#006eff; text-transform:uppercase; margin-bottom:28px;}
.starter-panel h1{font-size:36px; line-height:1.15; margin:0 0 14px; font-weight:600;}
.starter-panel>p{font-size:15px; line-height:1.7; color:#596675; margin:0 0 28px;}
.starter-steps{display:grid; gap:14px; margin-bottom:30px;}.starter-step{display:grid; grid-template-columns:34px 1fr; gap:12px; align-items:start;}
.starter-step b{width:30px; height:30px; display:grid; place-items:center; border:1px solid #bdd5f4; color:#006eff; border-radius:6px; font-size:12px;}
.starter-step strong{display:block; font-size:14px; margin-bottom:3px;}.starter-step span{display:block; font-size:12px; color:#6b7682; line-height:1.5;}
.starter-actions{display:flex; flex-wrap:wrap; gap:10px;}.starter-primary,.starter-secondary{border-radius:6px; padding:11px 16px; font-size:13px; font-weight:700; cursor:pointer;}
.starter-primary{border:1px solid #006eff; background:#006eff; color:#fff;}.starter-secondary{border:1px solid #c9d4df; background:#fff; color:#26313c;}
.lang-choice{display:flex; border:1px solid #cbd5df; border-radius:6px; overflow:hidden; width:max-content; margin-bottom:22px;}
.lang-choice button{border:0; background:#fff; color:#566270; padding:6px 11px; font-size:11px; cursor:pointer;}.lang-choice button.on{background:#006eff; color:#fff;}
.starter-mock{width:min(680px,100%); background:#fff; border:1px solid #d7e0e9; box-shadow:0 24px 70px rgba(27,55,83,.15); border-radius:8px; overflow:hidden;}
.starter-mock-bar{height:38px; border-bottom:1px solid #e4e9ef; display:flex; align-items:center; gap:6px; padding:0 14px;}.starter-mock-bar i{width:7px; height:7px; border-radius:50%; background:#c8d3df;}
.starter-mock-body{display:grid; grid-template-columns:130px 1fr; min-height:380px;}.starter-mock-side{border-right:1px solid #e4e9ef; padding:18px 12px;}
.starter-mock-side span{display:block; height:34px; border:1px solid #dce4ed; margin-bottom:9px; border-radius:4px;}.starter-mock-canvas{padding:26px; background:#f4f6f8;}
.starter-mock-hero{height:160px; background:url('https://irp.cdn-website.com/56869327/dms3rep/multi/Wireless-BG26.jpg') center/cover; border-radius:4px; position:relative;}
.starter-mock-hero::after{content:''; position:absolute; width:46%; inset:26px auto 26px 24px; background:rgba(255,255,255,.88); border-radius:3px;}
.starter-mock-cards{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:12px;}.starter-mock-cards span{height:82px; background:#fff; border:1px solid #e0e6ec; border-radius:4px;}
@media(max-width:850px){#stage-starter{grid-template-columns:1fr}.starter-preview{display:none}.starter-panel{border-right:0}.starter-panel h1{font-size:30px}}

/* ================= New page settings modal ================= */
#pageSetupModal{display:none; position:fixed; inset:0; z-index:300; align-items:center; justify-content:center; padding:24px; background:rgba(12,12,12,.52);}
#pageSetupModal.open{display:flex;}
.page-setup-card{width:min(620px,100%); max-height:90vh; overflow:auto; background:#F8F9FA; border:1px solid #C9CDD3; border-radius:10px; box-shadow:0 24px 70px rgba(0,0,0,.28); color:#24272C;}
.page-setup-head{padding:20px 22px 14px; border-bottom:1px solid #D8DBE0; background:#ECEEF1;}
.page-setup-head h2{font-size:20px; margin:0 0 5px;}.page-setup-head p{font-size:12px; line-height:1.5; color:#6F747C; margin:0;}
.page-setup-form{padding:20px 22px 22px; display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.page-setup-field{display:flex; flex-direction:column; gap:6px;}.page-setup-field.wide{grid-column:1/-1;}
.page-setup-field label{font-size:11px; font-weight:700; color:#444A52;}.page-setup-field label span{color:#D92D20;}
.page-setup-field input,.page-setup-field textarea,.page-setup-field select{width:100%; border:1px solid #C9CDD3; border-radius:6px; background:#fff; color:#24272C; font:12px/1.5 inherit; padding:9px 10px;}
.page-setup-field textarea{min-height:76px; resize:vertical;}.page-setup-field input:focus,.page-setup-field textarea:focus,.page-setup-field select:focus{outline:0; border-color:#006EFF; box-shadow:0 0 0 3px rgba(0,110,255,.1);}
.page-setup-error{display:none; grid-column:1/-1; color:#B42318; background:#FFF1F0; border:1px solid #FDA29B; border-radius:6px; padding:8px 10px; font-size:11px;}
.page-setup-actions{grid-column:1/-1; display:flex; justify-content:flex-end; gap:9px; padding-top:4px;}.page-setup-actions button{height:36px; border-radius:6px; padding:0 15px; font-size:12px; font-weight:700; cursor:pointer;}.page-setup-cancel{border:1px solid #C9CDD3; background:#fff; color:#344054;}.page-setup-submit{border:1px solid #006EFF; background:#006EFF; color:#fff;}
@media(max-width:600px){.page-setup-form{grid-template-columns:1fr}.page-setup-field.wide{grid-column:auto}.page-setup-error,.page-setup-actions{grid-column:auto}}

/* ================= Upload modal ================= */
#stage-upload{display:none; position:fixed; inset:0; z-index:200; align-items:center; justify-content:center; padding:32px 16px;
  background:rgba(12,12,12,.5);}
#stage-upload.open{display:flex;}
.upload-card{position:relative; width:100%; max-width:820px; max-height:90vh; overflow-y:auto; background:var(--ui-bg); border:1.5px solid var(--ui-border); border-radius:16px; padding:36px; color:var(--ui-text); box-shadow:0 20px 60px rgba(0,0,0,.3);}
.modal-close{position:absolute; top:14px; right:14px; border:none; background:transparent; color:var(--gray70); font-size:16px; cursor:pointer; padding:4px;}
.upload-card .badge{display:inline-block; font-size:11px; font-weight:600; color:var(--brand); background:var(--brand30); padding:3px 10px; border-radius:20px; margin-bottom:12px;}
.upload-card h1{font-size:22px; margin:0 0 6px; font-weight:600;}
.upload-card .lead{font-size:13px; color:var(--gray70); margin:0 0 24px; line-height:1.6; max-width:600px;}
.dropzones{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media (max-width:600px){.dropzones{grid-template-columns:1fr;}}
.dropzone{border:2px dashed var(--gray50); border-radius:12px; padding:22px 16px; text-align:center; cursor:pointer; background:var(--app-bg);}
.dropzone:hover, .dropzone.drag{border-color:var(--link); background:var(--brand30);}
.dropzone .dz-icon{width:32px; height:32px; margin:0 auto 8px; color:var(--brand);}
.dropzone h3{font-size:13px; margin:0 0 4px; font-weight:600;}
.dropzone p{font-size:11px; color:var(--gray70); margin:0 0 8px;}
.dropzone .dz-status{font-size:11px; font-weight:600; color:var(--success); min-height:15px;}
.dropzone .dz-status.empty{color:var(--gray70); font-weight:400;}
.dropzone input{display:none;}
.upload-actions{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:20px; flex-wrap:wrap;}
.link-btn{background:none; border:none; color:var(--link); font-size:12px; font-weight:600; cursor:pointer; padding:0;}
.link-btn:hover{text-decoration:underline;}
.paste-area{display:none; margin-top:14px;}
.paste-area.open{display:block;}
.paste-area textarea{width:100%; min-height:130px; font-family:"Courier New",monospace; font-size:11.5px; border:1.5px solid var(--ui-border); border-radius:8px; padding:10px; background:var(--app-bg); color:var(--gray90);}
#upload-error{display:none; margin-top:14px; font-size:12px; color:var(--error-d); background:var(--error-l); border:1px solid var(--error); border-radius:8px; padding:9px 12px;}
.go-btn{appearance:none; border:none; background:var(--link); color:#fff; font-size:13.5px; font-weight:600; padding:12px 26px; border-radius:6px; cursor:pointer;}
.go-btn:disabled{background:var(--gray50); color:var(--gray70); cursor:not-allowed;}
.hint-sm{font-size:11px; color:var(--gray70);}

/* ================= App shell ================= */
#stage-app{display:none; height:100vh; overflow:hidden; flex-direction:column; --editor-accent:#006EFF; --editor-ink:#24272C; --editor-muted:#6F747C; --editor-line:#D4D7DC; --editor-soft:#ECEEF1; --editor-panel:#F6F7F8; --editor-raised:#FCFCFD;}#stage-app.editing{display:flex;}
.app-header{height:64px; flex:0 0 64px; display:flex; align-items:center; justify-content:space-between; gap:20px; padding:0 20px; background:#F1F2F4; border-bottom:1px solid #CACDD2; color:var(--editor-ink); z-index:20; box-shadow:0 1px 0 rgba(255,255,255,.8) inset;}
.app-brand{display:flex; align-items:center; gap:8px; white-space:nowrap;}.app-brand img{width:120px; height:14px; object-fit:contain;}.app-brand span{font-size:12px; color:var(--editor-muted);}
.header-actions{display:flex; align-items:center; gap:9px;}.header-actions .lang-choice{margin:0;}.header-btn{height:36px; border:1px solid #C9CDD3; background:#FAFAFB; color:var(--editor-ink); border-radius:6px; padding:0 13px; font-size:12px; font-weight:700; cursor:pointer; box-shadow:0 1px 1px rgba(17,24,39,.04);}
.header-btn:hover{border-color:var(--editor-accent); color:var(--editor-accent);}.header-btn.primary{border-color:var(--editor-accent); background:var(--editor-accent); color:#fff; padding:0 17px;}.header-btn.primary:hover{background:#005ED9; color:#fff;}
.util-bar{background:var(--gray30); border-bottom:1px solid var(--gray50); font-size:11px; color:var(--gray80); padding:6px 20px; display:flex; justify-content:flex-end; align-items:center; gap:16px;}
.sb-top{display:flex; justify-content:flex-end; margin-bottom:10px;}.sb-top .lang-choice{margin:0;}
.main-nav{display:flex; align-items:center; gap:20px; padding:14px 20px; border-bottom:1px solid var(--gray50); background:#fff; flex-wrap:wrap;}
.nav-logo{font-size:18px; font-weight:700; color:var(--brand);}
.nav-logo span{color:var(--primary);}
.nav-links{display:flex; gap:18px; flex:1; flex-wrap:wrap;}
.nav-links a{font-size:12px; font-weight:500; color:var(--gray80);}
.nav-tools{display:flex; align-items:center; gap:12px; color:var(--gray80);}
.nav-search{display:flex; align-items:center; gap:6px; background:var(--gray30); border:1px solid var(--gray50); border-radius:16px; padding:6px 12px; font-size:11px; color:var(--gray70); min-width:150px;}

#app-body{flex:1; display:flex; min-height:0; overflow:hidden;}
#sidebar{width:280px; flex:0 0 280px; height:100%; background:#E9EBEE; color:var(--editor-ink); border-right:1px solid #CBCDCE; padding:18px; overflow:hidden; display:flex; flex-direction:column;}
#sidebar h2{font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--gray70); margin:18px 0 8px;}
#sidebar h2:first-child{margin-top:0;}
.sb-seg{display:flex; border:1px solid #C7CBD1; border-radius:8px; overflow:hidden; background:#F7F8F9;}
.sb-seg button{flex:1; border:none; background:transparent; color:#4A4F56; font-size:11px; font-weight:600; padding:7px 4px; cursor:pointer;}
.sb-seg button.on{background:var(--editor-accent); color:#fff;}
.sb-toggle{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:5px 0; color:#959595; font-size:12px; line-height:18px; font-weight:200;}
.switch{position:relative; width:34px; height:19px; flex:0 0 34px;}
.switch input{opacity:0; width:0; height:0;}
.switch .track{position:absolute; inset:0; background:var(--gray50); border-radius:20px; transition:.15s; cursor:pointer;}
.switch .track::before{content:''; position:absolute; width:15px; height:15px; left:2px; top:2px; background:#fff; border-radius:50%; transition:.15s;}
.switch input:checked + .track{background:var(--editor-accent);}
.switch input:checked + .track::before{transform:translateX(15px);}
.comp-list{display:flex; flex-direction:column; gap:5px;}
.comp-row{display:flex; align-items:center; gap:5px; background:var(--app-bg); border:1px solid var(--ui-border); border-radius:8px; padding:6px 7px; cursor:pointer;}
.comp-row.hidden-row{opacity:.45;}
.comp-row.selected{border-color:var(--link); background:var(--brand30);}
.comp-row .idx{font-size:9.5px; color:var(--gray70); width:14px; flex:0 0 14px;}
.comp-row .name{flex:1; min-width:0;}
.comp-row .name b{display:block; font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600;}
.comp-row .name span{display:block; font-size:9px; color:var(--gray70);}
.icon-btn{border:none; background:transparent; color:var(--ui-text); cursor:pointer; padding:3px; border-radius:5px; display:flex;}
.icon-btn:hover{background:var(--ui-border);}
.icon-btn:disabled{opacity:.25; cursor:default;}
.icon-btn:disabled:hover{background:transparent;}
.icon-btn svg{width:13px; height:13px;}
.sb-foot{margin-top:18px; padding-top:12px; border-top:1px solid var(--ui-border); display:flex; flex-direction:column; gap:8px;}
.btn-outline{border:1.5px solid var(--ui-border); background:transparent; color:var(--ui-text); border-radius:8px; padding:8px; font-size:11.5px; font-weight:600; cursor:pointer;}
.btn-outline:hover{background:var(--app-bg);}
.disclaimer{font-size:10px; color:var(--gray70); line-height:1.6; margin-top:12px;}

/* ---- editor: drag-drop component palette / export ---- */
.tpl-palette{display:flex; flex-direction:column; gap:8px; margin-top:8px;}
.palette-section{flex:1; min-height:0; display:flex; flex-direction:column; margin-top:4px;}.palette-section .tpl-palette{flex:1; min-height:0; overflow-y:auto; padding-right:0; scrollbar-width:none; -ms-overflow-style:none;}.palette-section .tpl-palette::-webkit-scrollbar{display:none;}
.tpl-chip{width:100%; min-height:58px; display:grid; grid-template-columns:42px 1fr 30px; align-items:center; gap:10px; border:1px solid #C8CCD2; background:#F8F9FA; color:#2E3238; border-radius:7px; padding:7px; font-size:11px; font-weight:700; cursor:grab; user-select:none; text-align:left; box-shadow:0 1px 2px rgba(17,24,39,.04);}
.tpl-chip:hover{border-color:var(--editor-accent); color:var(--editor-accent); box-shadow:0 0 0 2px rgba(0,110,255,.08);}
.tpl-chip:active{cursor:grabbing;}
.tpl-chip-icon{width:42px; height:42px; display:grid; place-items:center; color:#006eff; background:#EEF1F5; border:1px solid #D2D6DC; border-radius:6px;}.tpl-chip-icon svg{width:22px; height:22px;}
.tpl-chip-add{width:30px; height:30px; display:grid; place-items:center; background:#edf4ff; color:#006eff; border-radius:6px; font-size:24px; line-height:1; font-weight:400;}
.btn-primary-outline{border-color:var(--brand); color:var(--brand); font-weight:700;}
.btn-primary-outline:hover{background:var(--brand30);}
#empty-canvas{min-height:560px; padding:80px 24px; display:grid; place-items:center; text-align:center; color:var(--gray70); background-color:#F8F9FB; background-image:linear-gradient(#E9ECF0 1px,transparent 1px),linear-gradient(90deg,#E9ECF0 1px,transparent 1px); background-size:32px 32px;}
.empty-state{max-width:520px; padding:48px 40px; background:rgba(248,249,251,.92);}
.empty-state-icon{width:56px; height:56px; margin:0 auto 20px; display:grid; place-items:center; border-radius:50%; background:#E8F1FF; color:var(--editor-accent); font-size:32px; line-height:1; font-weight:300;}
#empty-canvas h2{color:var(--gray90); font-size:24px; line-height:1.25; font-weight:600; margin:0 0 10px;}
#empty-canvas p{max-width:460px; margin:0; color:var(--gray70); font-size:14px; line-height:1.65;}
.drop-indicator{height:3px; background:var(--link); margin:0; border-radius:2px;}

/* ---- settings panel editor controls ---- */
.sp-h4{font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:#344054; margin:18px 0 8px; padding-top:12px; border-top:1px solid var(--editor-line);}
.sp-h4-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.sp-h4-row .sp-h4{flex:1; margin-bottom:8px;}
.sp-h4-action{margin-top:18px;}
.sp-h4:first-child{margin-top:0; padding-top:0; border-top:none;}
.sp-pill.c{background:var(--brand30); color:var(--brand); font-size:8.5px; font-weight:700; padding:1px 6px; border-radius:10px; margin-left:6px;}
.sp-field textarea{width:100%; border:1px solid var(--editor-line); border-radius:6px; padding:9px 10px; font-size:12px; line-height:1.5; font-family:inherit; background:#fff; color:var(--editor-ink); resize:vertical;}
.sp-field input[type=text]{width:100%;}
.sp-imgrow{display:flex; align-items:center; gap:6px;}
.sp-thumb{width:44px; height:44px; flex:0 0 44px; border:1px solid var(--editor-line); border-radius:6px; background:var(--editor-soft); display:flex; align-items:center; justify-content:center; overflow:hidden; color:var(--editor-muted); font-size:10px;}
.sp-thumb img{width:100%; height:100%; object-fit:cover;}
.sp-imgrow input[type=text]{flex:1; min-width:0; border:1px solid var(--editor-line); border-radius:6px; padding:8px 9px; font-size:11px; background:#fff; color:var(--editor-ink);}
.sp-upload-btn{flex:0 0 auto; border:1px solid var(--editor-accent); color:var(--editor-accent); background:#fff; border-radius:6px; padding:7px 10px; font-size:11px; font-weight:700; cursor:pointer; position:relative; overflow:hidden;}
.sp-upload-btn input[type=file]{position:absolute; inset:0; opacity:0; cursor:pointer;}
.sp-group{margin-bottom:16px;}
.sp-group-title{font-size:10px; font-weight:700; color:var(--gray70); margin:0 0 7px; overflow-wrap:anywhere;}
.sp-item-controls{display:flex; justify-content:space-between; align-items:center; min-height:38px; padding:7px 9px; margin-bottom:8px; border:1px solid var(--editor-line); border-radius:6px; background:#E9EBEE; color:var(--editor-ink); font-size:11px; font-weight:600;}
.sp-group-head{display:flex; justify-content:space-between; align-items:center; font-size:11px; font-weight:700; color:var(--gray70); margin-bottom:8px;}
.sp-add-item{border:1px solid var(--editor-accent); color:var(--editor-accent); background:#fff; border-radius:5px; padding:4px 8px; font-size:10px; font-weight:700; cursor:pointer;}
.sp-count{border:1px solid var(--editor-line); border-radius:5px; background:#fff; color:var(--editor-ink); padding:4px 24px 4px 8px; font-size:10px; font-weight:700;}
.sp-item{border:1px solid #D9DDE3; border-radius:6px; margin-bottom:7px; background:#fff; overflow:hidden;}
.sp-item[open]{border-color:#B9C7D8; box-shadow:0 1px 3px rgba(16,24,40,.06);}
.sp-item-head{min-height:42px; display:grid; grid-template-columns:18px 24px minmax(0,1fr) auto; align-items:center; gap:7px; padding:8px 9px; font-size:10px; color:var(--gray70); cursor:pointer; list-style:none; user-select:none;}
.sp-item-head::-webkit-details-marker{display:none;}
.sp-item-head::before{content:'›'; grid-column:1; font-size:18px; line-height:1; color:var(--gray70); transition:transform .15s;}
.sp-item[open]>.sp-item-head::before{transform:rotate(90deg);}
.sp-item-index{grid-column:2; color:var(--editor-accent); font-weight:700;}
.sp-item-name{min-width:0; color:var(--editor-ink); font-size:11px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.sp-item-head code{display:none;}
.sp-item-body{padding:16px; border-top:1px solid #E5E7EB; background:var(--editor-soft); display:flex; flex-direction:column; gap:16px;}
.sp-del-item{margin-left:auto; border:none; background:transparent; color:var(--red); cursor:pointer; font-size:12px;}
.act-del svg{color:var(--red);}

#viewport-outer{flex:1; min-width:0; overflow:auto; background:#D9DCE1; padding:24px; overscroll-behavior:contain;}
#viewport-stage{position:relative; margin:0 auto; transition:width .2s,height .2s;}
#viewport-frame{width:100%; margin:0; background:#fff; box-shadow:0 0 0 1.5px var(--gray50); border-radius:8px; overflow:hidden; transform-origin:top left; container-type:inline-size; container-name:preview;}
#viewport-frame.vw-desktop{width:1400px;}
#viewport-frame.vw-laptop{width:1200px;}
#viewport-frame.vw-tablet{width:990px;}
#viewport-frame.vw-mobile{width:390px; max-width:390px; transform:none!important;}

/* ---- Settings panel: a real flex column, not an overlay — never covers the preview ---- */
#settingsPanel{flex:0 0 0px; width:0; overflow:hidden; height:100%; background:#F0F1F3; color:var(--editor-ink); border-left:0 solid #C8CBD0; transition:flex-basis .18s, width .18s; z-index:5;}
#settingsPanel.open{flex:0 0 360px; width:360px; border-left-width:1px;}
.sp-inner{width:360px; height:100%; overflow:hidden; display:flex; flex-direction:column;}
.sp-head{flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid #CED1D6; background:#E4E6E9;}
.sp-head h3{font-size:13px; margin:0; font-weight:600;}
.sp-head .tpl{font-size:10px; color:var(--gray70); font-family:"Courier New",monospace;}
.sp-close{border:none; background:transparent; cursor:pointer; color:var(--gray70); padding:4px;}
.sp-body{flex:1; min-height:0; overflow-y:auto; padding:16px 18px 48px; display:flex; flex-direction:column; gap:14px; overscroll-behavior:contain; scrollbar-width:thin; background:#F4F5F6;}
.sp-field{display:flex; flex-direction:column; gap:6px;}
.sp-field label{font-size:11px; font-weight:600; display:flex; align-items:center; gap:6px;}
.sp-field input:focus,.sp-field textarea:focus,.sp-field select:focus,.sp-imgrow input:focus{outline:0; border-color:var(--editor-accent); box-shadow:0 0 0 3px rgba(0,110,255,.1);}
.sp-pill{font-size:8.5px; font-weight:700; padding:1px 6px; border-radius:10px; letter-spacing:.02em;}
.sp-pill.k{background:var(--primary10); color:var(--primary-d);}
.sp-pill.l{background:var(--gray40); color:var(--gray70);}
.sp-field select, .sp-field input[type=text]{border:1px solid var(--editor-line); border-radius:6px; padding:8px 9px; font-size:12px; font-family:inherit; background:#fff; color:var(--editor-ink);}
.sp-locked{font-size:11.5px; font-family:"Courier New",monospace; color:var(--gray70); background:var(--app-bg); border:1px solid var(--ui-border); border-radius:6px; padding:6px 8px;}
.sp-empty{font-size:11.5px; color:var(--gray70); padding:20px 0; text-align:center;}

/* ================= Campaign body — matches production tokens ================= */
.canvas{width:100%;}
.cmp{position:relative;}
.cmp.contained{max-width:var(--maxw); margin:0 auto;}
.cmp-inner{max-width:var(--maxw); margin:0 auto; padding:var(--sec-pad); position:relative; z-index:1;}
.cmp-banner .cmp-inner{padding:var(--banner-pad);}
@container preview (max-width:992px){.cmp-inner{padding:36px;} .cmp-banner .cmp-inner{padding:36px;} .banner-media{max-width:100%; margin:0 auto;}}
@container preview (max-width:640px){.cmp-inner{padding:24px;} .cmp-banner .cmp-inner{padding:24px;}}
.cmp-tag{position:absolute; top:0; left:0; font-size:9px; font-family:"Courier New",monospace; background:rgba(0,0,0,.6); color:#fff; padding:3px 8px; border-radius:0 0 6px 0; z-index:5;}
body.hide-tags .cmp-tag{display:none;}
.cmp-actions{position:absolute; top:10px; right:10px; z-index:12; display:flex; gap:4px; padding:4px; border:1px solid rgba(17,24,39,.14); border-radius:7px; background:rgba(255,255,255,.96); box-shadow:0 4px 14px rgba(17,24,39,.13); opacity:.45; transition:opacity .15s,transform .15s;}
.cmp:hover .cmp-actions,.cmp.editing .cmp-actions,.cmp-actions:focus-within{opacity:1; transform:translateY(-1px);}
.cmp-action{width:28px; height:28px; display:grid; place-items:center; border:0; border-radius:5px; background:#fff; color:#344054; cursor:pointer;}.cmp-action:hover{background:#EDF4FF; color:#006EFF;}.cmp-action:disabled{opacity:.25; cursor:not-allowed;}.cmp-action.delete:hover{background:#FFF1F1; color:#D92D20;}.cmp-action svg{width:15px; height:15px;}
.dotgrid{background-image:radial-gradient(rgba(255,255,255,.14) 1px, transparent 1.4px); background-size:20px 20px;}
.eyebrow{font-size:16px; font-weight:600; color:var(--link); margin-bottom:8px; line-height:1.3; letter-spacing:.01em;}
.on-dark .eyebrow{color:var(--link);}
h2.cmp-title{font-size:40px; line-height:44px; font-weight:500; margin:0 0 16px; color:var(--gray90);}
.on-dark h2.cmp-title{color:#fff;}
h2.cmp-title::after{content:''; display:block; width:80px; height:4px; background:var(--link); margin-top:12px;}
h2.cmp-title.center::after{margin-left:auto; margin-right:auto;}
@container preview (max-width:992px){h2.cmp-title{font-size:32px; line-height:1.1;}}
.cmp p.desc{font-size:16px; line-height:24px; font-weight:400; color:var(--gray90); margin:0 0 8px; max-width:760px;}
.on-dark p.desc{color:#D7DEEA;}
.cmp.on-dark{color:#F8FAFC;}
.cmp.on-dark .cmp-inner :is(h1,h2,h3,h4,p,li,summary,.sub,.code,.desc-sm,.ans,.pname-sub,.p-card a.shop){color:#F8FAFC;}
.cmp.on-dark .cmp-inner :is(p,.desc,.ans,.code,.desc-sm,.pname-sub,li){color:#D7DCE4;}
.cmp.on-dark .cmp-inner :is(.fc-cards .cell,.p-card){background:#24272D; border-color:#494E56;}
.cmp.on-dark:is(.cmp-carousel,.cmp-gallery,.cmp-faq,.cmp-section,.cmp-collection,.cmp-concept){background-color:#17191D !important;}
.cmp.on-dark .faq-item{border-color:#667085;}
.cmp.on-dark .faq-item summary,.cmp.on-dark .faq-item summary .chev{color:#F8FAFC;}
.cmp.on-dark .scroll-arrow{background:#34383F; color:#F8FAFC;}
.center{text-align:center;}
.center p.desc{margin-left:auto; margin-right:auto;}
@container preview (max-width:992px){
  .cmp-inner > :is(.eyebrow,h2.cmp-title,p.desc),.fc-grid > div:first-child,.carousel-intro,.section-shell > div:first-child{text-align:center;}
  .cmp-inner > p.desc,.fc-grid > div:first-child p.desc,.carousel-intro p.desc,.section-shell > div:first-child p.desc{margin-left:auto; margin-right:auto;}
  .cmp-inner > h2.cmp-title::after,.fc-grid > div:first-child h2.cmp-title::after,.carousel-intro h2.cmp-title::after,.section-shell > div:first-child h2.cmp-title::after{margin-left:auto; margin-right:auto;}
}
.btn-solid{display:inline-block; background:var(--link); color:#fff; font-size:16px; line-height:24px; font-weight:400; padding:8px 16px; border-radius:2px;}
.btn-line{display:inline-block; background:var(--link); color:#fff; font-size:14px; line-height:20px; font-weight:400; padding:8px 16px; border-radius:2px;}
.btn-full{display:block; text-align:center; background:var(--link); color:#fff; font-size:13px; font-weight:400; padding:8px; border-radius:2px;}

/* Banner */
.cmp-banner{background-color:#DADDE0; background-size:cover; background-position:center;}
.cmp-banner.has-bg{background-image:var(--cmp-bg-image);}
.banner-grid{display:flex; gap:24px; align-items:center; min-height:320px;}
.banner-grid > div:first-child{flex:1.2;}
.banner-media{flex:1;}
@container preview (max-width:992px){
  .banner-grid{flex-direction:column; align-items:stretch; text-align:center;}
  .banner-media{order:-1;}
  .banner-text{display:flex; flex-direction:column; align-items:center; width:100%;}
  .banner-text h1{font-size:32px; line-height:1.1;}
  .banner-text .sub{font-size:16px;}
  .banner-text p{font-size:14px; width:100%; margin-left:auto; margin-right:auto; text-align:center;}
}
.banner-tags{font-size:13px; font-weight:600; color:var(--link); margin-bottom:10px;}
.banner-tags b{margin-right:10px; font-weight:600;}
.banner-text h1{font-size:40px; line-height:44px; font-weight:500; margin:0 0 12px; color:var(--gray90);}
.banner-text .sub{font-size:18px; line-height:24px; font-weight:600; color:var(--gray80); margin-bottom:10px;}
.banner-text p{font-size:16px; line-height:24px; color:var(--gray90); max-width:520px; margin:0 0 16px;}
.banner-media{max-width:480px; margin-left:auto;}
.banner-media img,.banner-media .img-missing{max-height:280px; width:100%; margin:0 auto; object-fit:contain;}
.on-dark .banner-text h1,.on-dark .banner-text .sub,.on-dark .banner-text p{color:#fff;}
.on-dark .banner-tags{color:#9FC1FF;}

/* Checkerboard feature-card panel */
.cmp-featurecard{background-color:var(--panel1); background-image:linear-gradient(120deg, var(--panel1), var(--panel2)); background-size:cover; background-position:center;}
.cmp-featurecard.has-bg{background-image:var(--cmp-bg-image);}
.fc-grid > div:first-child h2.cmp-title, .fc-grid > div:first-child p.desc{color:#fff;}
.cmp-featurecard.on-light .fc-grid > div:first-child :is(h2.cmp-title,p.desc){color:var(--gray90);}
.fc-grid{display:grid; grid-template-columns:minmax(0,30fr) minmax(0,70fr); gap:0; align-items:center;}
.fc-grid > div:first-child{padding-right:40px;}
@container preview (max-width:1199px){.fc-grid{grid-template-columns:1fr; gap:32px;}}
@container preview (max-width:1199px){.fc-grid > div:first-child{padding-right:0;}}
@container preview (max-width:992px){.fc-grid > div:first-child{text-align:center;}}
.fc-cards{display:grid; grid-template-columns:1fr 1fr;}
.fc-cards.count-6{grid-template-columns:repeat(3,1fr);}
.fc-cards .cell{padding:24px 36px; background:#fff;}
.fc-cards .cell:nth-child(1),.fc-cards .cell:nth-child(4){background:var(--gray40);}
.cmp.cmp-featurecard.on-dark .cmp-inner .fc-cards .cell{background:#fff; border-color:initial;}
.cmp.cmp-featurecard.on-dark .cmp-inner .fc-cards .cell:nth-child(1),.cmp.cmp-featurecard.on-dark .cmp-inner .fc-cards .cell:nth-child(4){background:var(--gray40);}
.cmp.cmp-featurecard.on-dark .cmp-inner .fc-cards :is(h3,p){color:var(--gray90);}
.cmp.cmp-featurecard.on-dark .cmp-inner .fc-cards .shield{color:var(--link);}
.cmp.cmp-featurecard.on-dark .cmp-inner .fc-cards .feature-icon{background-color:var(--link);}
.fc-cards .cell.dim{opacity:.4;}
.shield{width:48px; height:48px; color:var(--link); margin-bottom:8px; flex:0 0 auto;}
.feature-icon{display:block; width:48px; height:48px; margin-bottom:8px; flex:0 0 auto; background-color:var(--link); -webkit-mask-image:var(--icon-mask); mask-image:var(--icon-mask); -webkit-mask-size:contain; mask-size:contain; -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat; -webkit-mask-position:center; mask-position:center;}
.icon-missing{width:48px; height:48px; min-height:48px; margin-bottom:8px; padding:3px; overflow:hidden;}
.fc-cards h3{font-size:20px; line-height:24px; font-weight:600; margin:0 0 6px; color:var(--gray90);}
.fc-cards p{font-size:16px; line-height:19.2px; color:var(--gray90); margin:0;}
.hidden-flag{font-size:9px; font-weight:700; color:var(--error); margin-bottom:4px;}

/* Flat feature list (EdgeHub-style) */
.cmp-featurelist{background-color:var(--panel1); background-image:linear-gradient(120deg, var(--panel1), var(--panel2)); background-size:cover; background-position:center;}
.cmp-featurelist.has-bg{background-image:var(--cmp-bg-image);}
.flist-row{display:grid; grid-template-columns:repeat(3,1fr); gap:24px; margin-top:24px;}
.flist-row.count-2{grid-template-columns:repeat(2,1fr);}.flist-row.count-4,.flist-row.count-8{grid-template-columns:repeat(4,1fr);}
.flist-row.count-6,.flist-row.count-9{grid-template-columns:repeat(3,1fr);}
@container preview (max-width:1200px){.flist-item{flex-direction:column; align-items:center; text-align:center;}}
@container preview (max-width:992px){.flist-row{grid-template-columns:repeat(2,1fr);}}
.flist-item{display:flex; gap:12px;}
.flist-item .shield{width:48px; height:48px; margin-top:2px;}
.flist-item h3{font-size:16px; font-weight:600; color:#fff; margin:0 0 6px;}
.flist-item p{font-size:13px; line-height:19px; color:#CBD5EA; margin:0;}

/* Product anchors */
.cmp-anchors{background:var(--ink-bg);}
.cmp-anchors.has-bg{background-image:var(--cmp-bg-image); background-size:cover; background-position:center;}
.anchor-row{display:grid; grid-template-columns:repeat(3,1fr); gap:24px; margin-top:24px;}
.anchor-row.count-2{grid-template-columns:repeat(2,1fr);}.anchor-row.count-4,.anchor-row.count-8{grid-template-columns:repeat(4,1fr);}.anchor-row.count-6{grid-template-columns:repeat(3,1fr);}
@container preview (max-width:992px){.anchor-row{grid-template-columns:repeat(2,1fr);}}
.anchor-card{height:100%; display:flex; flex-direction:column; text-align:center;}
.anchor-card .art{height:120px; display:flex; align-items:flex-end; justify-content:center; margin-bottom:-88px; position:relative; z-index:2;}
.anchor-card .art img{max-height:120px; max-width:220px; margin:0 auto;}
.anchor-card .plate{flex:1; background:var(--gray40); padding:100px 16px 20px; position:relative; display:flex; flex-direction:column; transition:background-color .2s,color .2s;}
.anchor-card h3{font-size:20px; font-weight:600; color:var(--gray90); margin:0 0 3px;}
.anchor-card .desc-sm{flex:1; font-size:13px; color:var(--gray70); margin-bottom:14px;}
.anchor-dot{width:24px; height:24px; display:flex; align-items:center; justify-content:center; margin:0 auto; color:var(--gray90);}
.cmp-anchors.on-light .anchor-card:hover .plate{background:var(--link);}
.cmp-anchors.on-light .anchor-card:hover .plate :is(h3,.desc-sm,.anchor-dot){color:#fff;}
.cmp-anchors.on-dark .anchor-card .plate{background:var(--link);}
.cmp-anchors.on-dark .anchor-card .plate :is(h3,.desc-sm,.anchor-dot){color:#fff;}
.cmp-anchors.on-dark .anchor-card:hover .plate{background:var(--gray40);}
.cmp-anchors.on-dark .anchor-card:hover .plate :is(h3,.desc-sm,.anchor-dot){color:var(--gray90);}
.anchor-warn{margin-top:8px; font-size:10px; font-weight:700; color:var(--error);}

/* Series carousel */
.cmp-carousel{background:#fff;}
.cmp-carousel.has-bg{background-image:var(--cmp-bg-image); background-size:cover; background-position:center;}
.carousel-shell{display:flex; gap:64px; align-items:flex-start;}
.carousel-intro{flex:0 0 400px;}
@container preview (max-width:992px){.carousel-shell{flex-direction:column; align-items:stretch; gap:48px;} .carousel-intro{flex:none; width:100%; text-align:center;}}
.carousel-track-wrap{flex:1; min-width:0; position:relative;}
.carousel-track{display:flex; gap:16px; overflow-x:auto; scroll-behavior:smooth; scrollbar-width:none; -ms-overflow-style:none;}
.carousel-track::-webkit-scrollbar{display:none;}
.p-card{flex:0 0 calc((100% - 32px)/3); min-width:0; background:var(--gray40); padding:24px; text-align:center; display:flex; flex-direction:column; justify-content:space-between; scroll-snap-align:start; transition:background-color .3s;}
.p-card img{width:100%; height:auto; max-width:200px; object-fit:contain; margin:0 auto 16px;}
.p-card .img-missing{width:100%; max-width:200px; height:120px; margin:0 auto 16px;}
.p-card-content{flex:1;}
.p-card h4{font-size:18px; font-weight:600; color:var(--gray90); margin:0 0 8px;}
.p-card .code{font-size:14px; line-height:1.4; color:var(--gray70); margin:0;}
.p-card a.shop{display:flex; align-items:center; justify-content:center; gap:8px; margin:16px 0 8px; font-size:16px; line-height:28px; font-weight:500; color:var(--link); text-decoration:none;}
.p-card a.shop .shop-icon{width:24px; height:24px; border-radius:50%; background:var(--link); color:#fff; display:inline-flex; align-items:center; justify-content:center;}
.p-card a.shop .shop-icon .svgi{width:14px; height:14px;}
@media (hover:hover){.p-card:hover{background:var(--link);}.p-card:hover :is(h4,.code,a.shop){color:#fff;}.p-card:hover a.shop .shop-icon{background:#fff; color:var(--link);}}
.scroll-arrow{position:absolute; top:0; bottom:0; width:24px; height:auto; border:0; border-radius:0; background:transparent; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--link); z-index:2;}
.scroll-arrow.prev{left:0;}.scroll-arrow.next{right:0;}
.cmp .scroll-arrow.next{color:#D7DCE4; background:rgba(0,0,0,.2); opacity:0; transition:opacity .2s;}
.carousel-track-wrap:hover .scroll-arrow.next,.carousel-track-wrap:focus-within .scroll-arrow.next{opacity:1;}
.scroll-arrow:disabled{opacity:0; pointer-events:none;}
.cmp-carousel .dots{margin-top:24px;}
.cmp-carousel .dots button,.cmp-carousel .dots button.active{width:10px; height:10px; border-radius:50%;}
.dots{display:flex; gap:6px; justify-content:center; margin-top:16px;}
.dots button{width:8px; height:8px; padding:0; border:0; border-radius:50%; background:var(--gray50); cursor:pointer; transition:width .18s,background-color .18s;}
.dots button.active{background:var(--link); width:20px; border-radius:4px;}
.dots button[hidden]{display:none;}
@container preview (max-width:1200px) and (min-width:641px){.p-card{flex-basis:calc((100% - 16px)/2);}}

/* Gallery */
.cmp-gallery{background:#fff;}
.cmp-gallery.has-bg{background-image:var(--cmp-bg-image); background-size:cover; background-position:center;}
.gallery-strip{display:grid; grid-template-columns:repeat(4,1fr); gap:0; margin-top:24px;}
.gallery-strip.count-3{grid-template-columns:repeat(3,1fr);}
@container preview (max-width:1200px){.gallery-strip{grid-template-columns:repeat(2,1fr);}}
@container preview (max-width:640px){.gallery-strip{grid-template-columns:1fr;}}
.gallery-tile{position:relative; height:375px; background-size:cover; background-position:center; background-color:var(--gray60); display:flex; align-items:flex-end; overflow:hidden;}
.gallery-tile .ov{width:100%; padding:24px; background:linear-gradient(transparent,rgba(0,0,0,.9)); display:grid; grid-template-rows:auto 0fr; transition:grid-template-rows .45s cubic-bezier(.25,1,.5,1);}
.gallery-tile h4{color:#fff; font-size:28px; font-weight:600; margin:0 0 8px;}
.gallery-tile :is(h4,p){text-shadow:0 1px 4px rgba(0,0,0,.8);}
.gallery-tile p{color:#fff; font-size:16px; line-height:1.4; margin:0; overflow:hidden; transform:translateY(8px); opacity:0; transition:transform .45s cubic-bezier(.25,1,.5,1),opacity .45s cubic-bezier(.25,1,.5,1);}
@media (hover:hover){.gallery-tile:hover .ov{grid-template-rows:auto 1fr;}.gallery-tile:hover p{transform:translateY(0); opacity:1;}}
@container preview (max-width:992px){.gallery-tile{height:300px;}}

/* Product grid */
.cmp-pgrid{background:var(--ink-bg);}
.cmp-pgrid.has-bg{background-image:var(--cmp-bg-image); background-size:cover; background-position:center;}
.pgrid-row{display:grid; grid-template-columns:repeat(4,1fr); gap:22px; margin-top:24px;}
@container preview (max-width:1200px){.pgrid-row{grid-template-columns:repeat(3,1fr);}}
@container preview (max-width:992px){.pgrid-row{grid-template-columns:repeat(2,1fr);}}
.pgrid-item{text-align:center;}
.pgrid-item img,.pgrid-item .img-missing{height:120px; object-fit:contain; margin:0 auto 14px;}
.pgrid-item h4{color:#fff; font-size:16px; font-weight:600; margin:0 0 4px;}
.pgrid-item p{color:#B9C2CC; font-size:12px; margin:0 0 12px; line-height:1.5;}
.pgrid-item .btn-line{display:block; width:100%;}

/* FAQ */
.cmp-faq{background:#fff;}
.faq-wrap{max-width:900px; margin:0 auto;}
.faq-item{border-bottom:1px solid var(--link); padding:24px 0;}
.faq-item summary{display:flex; align-items:center; justify-content:space-between; gap:12px; cursor:pointer; list-style:none; color:var(--link); font-weight:600; font-size:18px; line-height:21.6px;}
.faq-item summary::-webkit-details-marker{display:none;}
.faq-item summary .chev{transition:transform .15s; color:var(--link); flex:0 0 auto; width:24px; height:24px;}
.faq-item[open] summary .chev{transform:rotate(180deg);}
.faq-item .ans{font-size:16px; line-height:24px; color:var(--gray90); margin-top:10px;}

/* Feature section: white bg, navy cards */
.cmp-section{background:#fff;}
.cmp-section.has-bg{background-image:var(--cmp-bg-image); background-size:cover; background-position:center;}
.section-shell{display:grid; grid-template-columns:400px 1fr; gap:64px; align-items:start;}
.section-shell.stacked{grid-template-columns:1fr; gap:36px;}
.section-shell.stacked .section-descriptions{display:grid; grid-template-columns:1fr 1fr; gap:64px;}
@container preview (max-width:1199px){.section-shell{grid-template-columns:1fr;}}
.section-cards{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px;}
.section-cards.count-4,.section-cards.count-8{grid-template-columns:repeat(4,1fr);}.section-cards.count-6{grid-template-columns:repeat(3,1fr);}
.section-shell.horizontal .section-cards.count-4{grid-template-columns:repeat(2,1fr);}
@container preview (max-width:992px){.section-cards{grid-template-columns:repeat(2,1fr);}}
@container preview (max-width:640px){.section-cards{grid-template-columns:1fr;}}
.navy-card{background:var(--navy-acc); padding:24px 20px;}
.navy-card .shield{color:#fff; width:48px; height:48px;}
.navy-card h4{color:#fff; font-size:16px; font-weight:600; margin:8px 0 6px;}
.navy-card p{color:#B9C2CC; font-size:12px; line-height:1.5; margin:0;}

/* Bordered carousel cards */
.cmp-bcarousel{background:var(--ink-bg);}
.cmp-bcarousel.has-bg{background-image:var(--cmp-bg-image); background-size:cover; background-position:center;}
.cmp-bcarousel .cmp-inner{display:flex; flex-direction:column; gap:48px;}
.bcarousel-title{max-width:1000px;}
.bcards-wrap{position:relative; width:100%; margin-bottom:40px; padding:0 24px;}
.bcards-viewport{overflow:hidden;}
.bcards-track{display:flex; gap:24px; overflow-x:auto; scroll-behavior:smooth; scrollbar-width:none; -ms-overflow-style:none;}
.bcards-track::-webkit-scrollbar{display:none;}
.bcard{flex:0 0 calc((100% - 48px)/3); min-width:0; border:1px solid rgba(255,255,255,.32); padding:32px 24px; display:flex; flex-direction:column; align-items:center; gap:16px; text-align:center; background:transparent; transition:background-color .3s,border-color .3s,color .3s; scroll-snap-align:start;}
.bcard .shield,.bcard .feature-icon{margin:0 auto 8px; color:#fff; width:64px; height:64px;}
.bcard h4{color:#fff; font-size:18px; line-height:1.3; font-weight:600; margin:0;}
.bcard p{flex:1; color:rgba(255,255,255,.75); font-size:14px; line-height:1.5; margin:0;}
.cmp-bcarousel.on-light{background-color:#fff;}
.cmp-bcarousel.on-light.has-bg{background-image:var(--cmp-bg-image);}
.cmp-bcarousel.on-light .bcard{border-color:var(--gray50); background:transparent; color:var(--gray90);}
.cmp-bcarousel.on-light .bcard :is(.shield,.feature-icon,h4,p){color:var(--gray90);}
.cmp-bcarousel .bcard:hover{background:var(--link); border-color:var(--link);}
.cmp-bcarousel .bcard:hover :is(.shield,.feature-icon,h4,p){color:#fff;}
.cmp-bcarousel .bcard:hover .feature-icon{background-color:#fff;}
.bcarousel-arrow{position:absolute; top:0; bottom:0; z-index:2; width:24px; height:auto; margin:auto; padding:0; border:0; border-radius:0; background:var(--gray40); color:var(--gray90); display:flex; align-items:center; justify-content:center; cursor:pointer;}
.bcarousel-arrow.prev{left:0;}.bcarousel-arrow.next{right:0;}
.bcarousel-arrow:disabled{opacity:0; pointer-events:none; background:transparent;}
.bcarousel-arrow svg{width:18px; height:18px;}
.bcarousel-dots{margin-top:-24px; margin-bottom:0;}
@container preview (max-width:991px){
  .cmp-bcarousel .cmp-inner{gap:32px;}
  .bcarousel-title{text-align:center; max-width:none;}
  .bcards-wrap{padding:0; margin-bottom:0;}
  .bcards-viewport{overflow:visible;}
  .bcards-track{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; overflow:visible;}
  .bcard{width:auto; padding:24px 16px;}
  .bcarousel-arrow,.bcarousel-dots{display:none!important;}
}

/* Product collection */
.cmp-collection{background:#fff;}
.cmp-collection.has-bg{background-image:var(--cmp-bg-image); background-size:cover; background-position:center;}
.coll-content{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); grid-template-rows:repeat(4,auto); gap:0 24px; margin-top:48px;}
.coll-content.count-2{grid-template-columns:repeat(2,minmax(0,1fr));}
.coll-series,.coll-products{display:contents;}
.coll-hero{grid-row:1; min-width:0; padding:40px; border-radius:8px; overflow:hidden; display:flex; flex-direction:column; gap:24px; align-items:center; text-align:center; color:#fff; background-color:var(--link); background-size:cover; background-position:center;}
.coll-hero.has-series-bg{background-color:transparent; background-image:var(--series-bg);}
.coll-hero-media{width:100%; max-width:350px; aspect-ratio:16/10; padding:20px;}
.coll-hero-media img,.coll-hero-media .img-missing{width:100%; height:100%; object-fit:contain; margin:0;}
.coll-hero h3{font-size:32px; line-height:1.2; font-weight:600; margin:0 0 8px; color:#fff;}
.coll-hero .sub{font-size:18px; line-height:1.4; color:#fff;}
.coll-hero ul{margin:24px 0 0; padding:24px 0 0 24px; border-top:1px solid rgba(255,255,255,.58); text-align:left; color:#fff;}
.coll-hero li{font-size:16px; line-height:1.5; margin-bottom:12px;}
.coll-product{display:flex; align-items:flex-start; min-width:0; height:100%; padding:24px 0; border-bottom:1px solid var(--link); color:inherit;}
.coll-product:nth-child(1){grid-row:2;}.coll-product:nth-child(2){grid-row:3;}.coll-product:nth-child(3){grid-row:4;}
.coll-product-media{width:100%; max-width:180px; aspect-ratio:4/3; padding:8px; flex:0 1 42%;}
.coll-product-media img,.coll-product-media .img-missing{width:100%; height:100%; object-fit:contain; margin:0;}
.coll-product-copy{flex:1; min-width:0; display:flex; flex-direction:column; gap:12px; padding:16px; text-align:left;}
.coll-product h4{font-size:18px; line-height:1.3; font-weight:600; margin:0; color:var(--gray90); overflow-wrap:anywhere;}
.coll-product .pname-sub{flex:1; font-size:14px; line-height:1.5; color:var(--gray80); overflow-wrap:anywhere;}
.coll-product .btn-full{width:100%; padding:10px 24px; border-radius:4px; font-size:14px; font-weight:600;}
@container preview (max-width:1200px){
  .coll-hero{padding:24px;}
  .coll-product{flex-direction:column; align-items:center;}
  .coll-product-media{flex:none;}
  .coll-product-copy{width:100%;}
}
@container preview (max-width:992px){
  .coll-content{margin-top:24px;}
  .coll-hero{padding:16px;}
  .coll-hero h3{font-size:24px;}
}
@container preview (max-width:768px){
  .coll-content{display:flex; flex-direction:column; gap:48px;}
  .coll-series{display:flex; flex-direction:column; gap:24px;}
  .coll-products{display:flex; flex-direction:column;}
  .coll-hero{padding:24px;}
  .coll-product{flex-direction:row;}
}

/* Concept intro */
.cmp-concept{background:#fff; border-top:1px solid var(--gray50);}
.cmp-concept.has-bg{background-image:var(--cmp-bg-image); background-size:cover; background-position:center;}
.cmp-concept.concept-half-background.has-bg{position:relative; overflow:hidden; background-image:none;}
.cmp-concept.concept-half-background.has-bg::before{content:''; position:absolute; inset:0 auto 0 0; width:50%; background-image:var(--cmp-bg-image); background-size:cover; background-position:right center; background-repeat:no-repeat;}
.cmp-concept.concept-half-background.has-bg::after{content:''; position:absolute; inset:0 0 0 50%; background:#fff;}
.cmp-concept.concept-half-background.on-dark.has-bg::after{background:var(--navy-acc);}
.concept-shell{display:flex; gap:40px;}
@container preview (max-width:768px){.concept-shell{flex-direction:column;}.cmp-concept.concept-half-background.has-bg{background-image:var(--cmp-bg-image); background-size:cover; background-position:center;}.cmp-concept.concept-half-background.has-bg::before,.cmp-concept.concept-half-background.has-bg::after{display:none;}}
.concept-shell h2{flex:1; font-size:32px; line-height:1.2; font-weight:500; text-transform:uppercase; margin:0; color:var(--gray90);}
.concept-shell p{flex:1.3; font-size:16px; line-height:24px; color:var(--gray90); margin:0;}

/* Button section */
.cmp-button{background:#fff; background-size:cover; background-position:center;}
.cmp-button.has-bg{background-image:var(--cmp-bg-image);}
.button-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(0,1fr)); gap:16px; width:100%;}
.campaign-button{display:flex; align-items:center; justify-content:center; width:100%; max-width:500px; min-height:48px; justify-self:center; padding:12px 20px; border:2px solid var(--link); border-radius:2px; font-size:16px; line-height:20px; font-weight:500; text-align:center;}
.campaign-button.ds-btn-cta{background:var(--link); color:#fff;}
.campaign-button.ds-btn-cta-ol{background:transparent; color:var(--link);}
@container preview (max-width:480px){.button-grid{grid-template-columns:1fr;}}

/* Stripe banner */
.cmp-stripe{background:#fff;}
.cmp-stripe .cmp-inner{max-width:1600px; padding:0;}
.stripe-media{display:block; width:100%; aspect-ratio:8 / 1; overflow:hidden; background:var(--gray40);}
.stripe-media img{display:block; width:100%; height:100%; object-fit:cover; object-position:center center;}
.stripe-media .img-missing{width:100%; height:100%;}

/* Responsive behavior follows the production campaign's 1200 / 992 / 640 rhythm. */
@container preview (max-width:640px){
  .cmp-inner,.cmp-banner .cmp-inner{padding:24px;}
  h2.cmp-title{font-size:32px; line-height:1.1; margin-bottom:14px;}
  h2.cmp-title::after{width:56px; height:3px; margin-top:10px;}
  .cmp p.desc{font-size:14px; line-height:21px;}
  .eyebrow{font-size:14px;}

  .banner-grid{min-height:0; gap:20px;}
  .banner-media img,.banner-media .img-missing{max-height:220px;}
  .banner-text h1{font-size:32px; line-height:1.1;}
  .banner-tags{font-size:11px; line-height:1.5;}

  .fc-grid{gap:24px;}
  .fc-cards .cell{padding:18px 16px;}
  .fc-cards h3{font-size:16px; line-height:20px;}
  .fc-cards p{font-size:13px; line-height:18px;}
  .fc-cards .shield,.fc-cards .feature-icon{width:40px; height:40px;}

  .flist-row{grid-template-columns:1fr; gap:8px;}
  .flist-item{flex-direction:row; align-items:flex-start; text-align:left; padding:8px 0;}
  .flist-item .shield,.flist-item .feature-icon{width:40px; height:40px;}

  .anchor-row{grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px;}
  .anchor-card .art{height:92px; margin-bottom:-64px;}
  .anchor-card .art img{max-height:92px; max-width:100%;}
  .anchor-card .plate{padding:72px 10px 14px; min-height:170px;}
  .anchor-card h3{font-size:15px; line-height:19px;}
  .anchor-card .desc-sm{font-size:11px; line-height:16px;}

  .carousel-shell{gap:24px;}
  .carousel-track{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; overflow:visible; padding:0;}
  .p-card{min-width:0; width:auto; padding:16px;}
  .p-card img,.p-card .img-missing{width:100%; height:96px;}
  .scroll-arrow{display:none;}

  .gallery-strip{grid-template-columns:1fr; gap:1px;}
  .gallery-tile{height:300px;}
  .gallery-tile .ov{grid-template-rows:auto 1fr;}
  .gallery-tile p{transform:translateY(0); opacity:1;}

  .pgrid-row{grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px 12px;}
  .pgrid-item img,.pgrid-item .img-missing{width:100%; height:96px;}
  .pgrid-item h4{font-size:14px; line-height:18px;}
  .pgrid-item p{font-size:11px; line-height:16px;}

  .faq-item{padding:18px 0;}
  .faq-item summary{font-size:16px; line-height:21px;}
  .faq-item .ans{font-size:14px; line-height:21px;}

  .section-shell{gap:24px;}
  .section-cards{grid-template-columns:1fr;}
  .section-shell.horizontal .section-cards.count-4{grid-template-columns:1fr;}
  .navy-card{padding:20px 16px; text-align:center;}
  .navy-card .shield,.navy-card .feature-icon{width:48px; height:48px; margin-left:auto; margin-right:auto;}

  .bcards-track{grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px;}
  .bcard{min-width:0; width:auto; padding:24px 14px;}
  .bcard .shield,.bcard .feature-icon{width:48px; height:48px; margin-left:auto; margin-right:auto;}

  .coll-content{gap:32px;}
  .coll-series{gap:20px;}
  .coll-product-copy{padding:14px 10px;}
  .concept-shell{gap:20px;}
  .concept-shell h2{font-size:22px; line-height:26px;}
  .concept-shell p{font-size:14px; line-height:21px;}
}

/* shared */
.img-missing{border:1.5px dashed var(--error); background:var(--error-l); color:var(--error-d); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:10px; font-size:10px; text-align:center; min-height:70px;}
.img-missing code{font-size:9px; word-break:break-all; opacity:.85;}
.unknown{background:var(--error-l); border:1.5px solid var(--error); border-radius:8px; padding:16px; font-size:12px;}
.unknown pre{white-space:pre-wrap; word-break:break-all; font-size:10.5px; max-height:260px; overflow:auto;}
.pagemeta{background:#fff; border-bottom:1.5px solid var(--gray50); padding:10px 20px;}
.pagemeta summary{cursor:pointer; font-size:12px; font-weight:600; color:var(--brand);}
.pagemeta table{border-collapse:collapse; margin-top:8px; font-size:11.5px;}
.pagemeta td{padding:3px 10px 3px 0; vertical-align:top;}
.pagemeta td.k{font-weight:700; color:var(--gray80); white-space:nowrap;}

  function doParse(text){
    MISSING = [];
    var doc = jsyaml.load(text);
    if(!doc || typeof doc !== 'object') throw new Error(t('topLevelErr'));
    var rootKey = Object.keys(doc)[0]; var page = doc[rootKey];
    if(!page || !page.mainBody) throw new Error(t('mainBodyErr'));
    var mainBody = page.mainBody;
    var order = Object.keys(mainBody).filter(function(k){return !isMeta(k);});
    order = order.filter(function(k){ return mainBody[k] && typeof mainBody[k]==='object'; });
    return { rootKey:rootKey, page:page, mainBody:mainBody, order:order };
  }

  function removeComponent(key){

    Object.keys(assetsMap).forEach(function(path){ if(path.indexOf('assets/'+key+'-')===0) delete assetsMap[path]; });
    Object.keys(FILES).forEach(function(path){ if(path.indexOf('assets/'+key+'-')===0) delete FILES[path]; });

  document.getElementById('preview').addEventListener('click',function(event){
    var dot=event.target.closest('[data-carousel-dot]');
    if(dot){
      event.preventDefault(); event.stopPropagation();
      var dots=dot.closest('[data-carousel-dots]'); var track=document.getElementById(dots.dataset.carouselDots);
      var card=track&&track.children[0]; if(!card) return;
      var step=track.children[1]?track.children[1].offsetLeft-track.children[0].offsetLeft:card.getBoundingClientRect().width;
      var left=Math.min(Number(dot.dataset.carouselDot)*step,track.scrollWidth-track.clientWidth);
      track.scrollTo({left:left,behavior:'smooth'}); return;
    }
    var prev=event.target.closest('[data-carousel-prev]');
    if(prev){
      event.preventDefault(); event.stopPropagation();
      var prevTrack=document.getElementById(prev.dataset.carouselPrev); var prevCard=prevTrack&&prevTrack.children[0];
      if(prevCard){ var prevStep=prevTrack.children[1]?prevTrack.children[1].offsetLeft-prevTrack.children[0].offsetLeft:prevCard.getBoundingClientRect().width; prevTrack.scrollBy({left:-prevStep,behavior:'smooth'}); } return;
    }
    var next=event.target.closest('[data-carousel-next]');
    if(next){
      event.preventDefault(); event.stopPropagation();
      var nextTrack=document.getElementById(next.dataset.carouselNext); var nextCard=nextTrack&&nextTrack.children[0];
      if(nextCard){ var nextStep=nextTrack.children[1]?nextTrack.children[1].offsetLeft-nextTrack.children[0].offsetLeft:nextCard.getBoundingClientRect().width; nextTrack.scrollBy({left:nextStep,behavior:'smooth'}); } return;
    }
    var button=event.target.closest('.cmp-action');
    if(!button){
      var inner=event.target.closest('.cmp-inner'); if(!inner) return;
      var component=inner.closest('.cmp'); if(!component || !component.dataset.key) return;
      if(event.target.closest('a')) event.preventDefault();
      openSettings(component.dataset.key); paintPreview(); return;
    }
    event.preventDefault(); event.stopPropagation();
    var key=button.dataset.key, index=STATE.order.indexOf(key), action=button.dataset.action;
    if(action==='edit'){ openSettings(key); paintPreview(); return; }
    if(action==='up'&&index>0) STATE.order.splice(index-1,0,STATE.order.splice(index,1)[0]);
    if(action==='down'&&index<STATE.order.length-1) STATE.order.splice(index+1,0,STATE.order.splice(index,1)[0]);
    if(action==='delete'){ removeComponent(key); return; }
    paintPreview();
  });

    return '<div class="sp-field"><label>'+esc(fieldLabel(name))+pill+'</label><select data-field="'+name+'"'+(isItem?' data-item="'+isItem+'"':'')+'><option value="true"'+(toBool(value)?' selected':'')+'>'+t('enabled')+'</option><option value="false"'+(!toBool(value)?' selected':'')+'>'+t('disabled')+'</option></select></div>';

  function resizeGroup(node,groupKey,target){
    if(!node[groupKey]) node[groupKey]={};
    var group=node[groupKey];
    var keys=Object.keys(group).filter(function(key){return !isMeta(key);});
    while(keys.length>target){ delete group[keys.pop()]; }
    var sources=keys.map(function(key){return group[key];});
    while(keys.length<target){
      var index=keys.length;
      var source=sources.length?sources[index%sources.length]:{};
      var item=JSON.parse(JSON.stringify(source));
      var key=groupKey+index;
      if(item.title) item.title=item.title.replace(/\s+\d+$/,'')+' '+(index+1);
      if(item.subTitle) item.subTitle=item.subTitle.replace(/\s+\d+$/,'')+' '+(index+1);
      if(item.itemTitle) item.itemTitle=item.itemTitle.replace(/\s+\d+$/,'')+' '+(index+1);
      if(item.productTitle) item.productTitle=item.productTitle.replace(/\s+\d+$/,'')+' '+(index+1);
      group[key]=item; keys.push(key);
    }
  }

  function itemEditorName(item,index){
    return t('itemFallback')+' '+String(index+1).padStart(2,'0');
  }
  function addGroupItem(node,tpl,groupKey){
    if(!node[groupKey]) node[groupKey]={};
    var group=node[groupKey];
    var keys=Object.keys(group).filter(function(key){return !isMeta(key);});
    var source=keys.length?group[keys[keys.length-1]]:null;
    if(!source){
      var defaults=defaultNode(tpl); var defaultGroup=defaults[groupKey]||{};
      var defaultKey=Object.keys(defaultGroup).find(function(key){return !isMeta(key);});
      source=defaultKey?defaultGroup[defaultKey]:{};
    }
    var item=JSON.parse(JSON.stringify(source||{}));
    var index=keys.length;
    ['title','subTitle','itemTitle','productTitle','productName','question'].forEach(function(field){
      if(item[field]) item[field]=item[field].replace(/\s+\d+$/,'')+' '+(index+1);
    });
    var itemKey=groupKey+index;
    while(group[itemKey]!==undefined){ index++; itemKey=groupKey+index; }
    group[itemKey]=item;
    return itemKey;
  }

  function collectionSeriesNums(node){
    var nums=[];
    Object.keys(node).forEach(function(key){ var match=key.match(/^series(\d+)Title$/); if(match) nums.push(Number(match[1])); });
    return nums.sort(function(a,b){return a-b;});
  }
  function resizeCollectionSeries(node,target){
    var nums=collectionSeriesNums(node);
    while(nums.length>target){
      var remove=nums.pop();
      var removePattern=new RegExp('^series'+remove+'(?:[^0-9]|$)');
      Object.keys(node).forEach(function(key){ if(key==='backgroundSeries'+remove||removePattern.test(key)) delete node[key]; });
    }
    while(nums.length<target){
      var next=nums.length+1; var source=nums[nums.length-1]||1;
      var sourcePattern=new RegExp('^series'+source+'(?=[^0-9]|$)');
      Object.keys(node).forEach(function(key){
        var mapped='';
        if(key==='backgroundSeries'+source) mapped='backgroundSeries'+next;
        else if(sourcePattern.test(key)) mapped=key.replace(sourcePattern,'series'+next);
        if(!mapped) return;
        var value=JSON.parse(JSON.stringify(node[key]));
        if(mapped==='series'+next+'Products'){
          var products={}; Object.keys(value).forEach(function(itemKey){ products[itemKey.replace(sourcePattern,'series'+next)]=value[itemKey]; }); value=products;
        }
        node[mapped]=value;
      });
      nums.push(next);
    }
  }

  function syncViewportScale(){
    var mode=viewportFrame.classList.contains('vw-desktop')?'desktop':viewportFrame.classList.contains('vw-laptop')?'laptop':viewportFrame.classList.contains('vw-tablet')?'tablet':'mobile';
    var widths={desktop:1400,laptop:1200,tablet:990,mobile:390};
    var logicalWidth=widths[mode];
    var outerStyle=getComputedStyle(viewportOuter);
    var available=viewportOuter.clientWidth-parseFloat(outerStyle.paddingLeft)-parseFloat(outerStyle.paddingRight);
    var scale=mode==='mobile'?1:Math.min(1,available/logicalWidth);
    viewportFrame.style.transform=mode==='mobile'?'none':'scale('+scale+')';
    viewportStage.style.width=(logicalWidth*scale)+'px';
    viewportStage.style.height=(viewportFrame.scrollHeight*scale)+'px';
    viewportStage.dataset.scale=scale.toFixed(3);
  }
  if(typeof ResizeObserver!=='undefined'){
    new ResizeObserver(syncViewportScale).observe(viewportOuter);
    new ResizeObserver(syncViewportScale).observe(viewportFrame);
  } else {
    window.addEventListener('resize',syncViewportScale);
  }

  function wireProductCarousels(){
    document.querySelectorAll('[data-carousel-dots]').forEach(function(dots){
      var track=document.getElementById(dots.dataset.carouselDots); if(!track||!track.children.length) return;
      function sync(){
        var cardWidth=track.children[0].getBoundingClientRect().width||1;
        var step=track.children[1]?track.children[1].offsetLeft-track.children[0].offsetLeft:cardWidth;
        var pageCount=Math.max(1,Math.min(dots.children.length,Math.ceil((track.scrollWidth-track.clientWidth)/step)+1));
        var active=Math.min(pageCount-1,Math.round(track.scrollLeft/step));
        var prev=document.querySelector('[data-carousel-prev="'+dots.dataset.carouselDots+'"]');
        var next=document.querySelector('[data-carousel-next="'+dots.dataset.carouselDots+'"]');
        if(prev) prev.disabled=track.scrollLeft<1;
        if(next) next.disabled=track.scrollLeft>=track.scrollWidth-track.clientWidth-1;
        dots.hidden=pageCount<=1;
        Array.prototype.forEach.call(dots.children,function(dot,index){ dot.hidden=index>=pageCount; dot.classList.toggle('active',index===active); });
      }
      track.addEventListener('scroll',sync,{passive:true});
      requestAnimationFrame(sync);
      if(typeof ResizeObserver!=='undefined') new ResizeObserver(sync).observe(track);
    });
  }

  function loadAssetFiles(list){
    Object.keys(assetsMap).forEach(function(k){ try{ URL.revokeObjectURL(assetsMap[k]); }catch(_){} });
    assetsMap = {}; var n=0;
    list.forEach(function(f){ var rel=f.webkitRelativePath||f.name; var idx=rel.indexOf('assets/'); var key = idx>=0?rel.slice(idx):rel; assetsMap[key]=URL.createObjectURL(f); FILES[key]=f; n++; });

    var items = e.dataTransfer.items; var files=[]; var pending=0, done=false;

    function readEntry(entry, path){
      if(entry.isFile){ pending++; entry.file(function(file){ try{ Object.defineProperty(file,'webkitRelativePath',{value:path+file.name}); }catch(_){}
        files.push(file); pending--; finish(); }, function(){ pending--; finish(); }); }
      else if(entry.isDirectory){ var reader=entry.createReader(); pending++;
        reader.readEntries(function(entries){ entries.forEach(function(en){ readEntry(en, path+entry.name+'/'); }); pending--; finish(); }, function(){ pending--; finish(); }); }
    }
    if(items && items.length && items[0].webkitGetAsEntry){
      for(var i=0;i<items.length;i++){ var entry=items[i].webkitGetAsEntry(); if(entry) readEntry(entry, ''); }
      done=true; finish();
    } else if(e.dataTransfer.files.length){ loadAssetFiles(Array.prototype.slice.call(e.dataTransfer.files)); }
  });

  /* ============================================================
   * YAML export (serializer + ZIP with uploaded/known image files)
   * ============================================================ */
  function yq(s){ return "'" + String(s).replace(/'/g,"''") + "'"; }
  function yamlValue(v){
    if(typeof v === 'boolean') return String(v);
    return yq(v == null ? '' : v);
  }
  function serializeValue(key, value, indent){
    var pad = '  '.repeat(indent);
    if(typeof value === 'string' && /\r?\n/.test(value)){
      return [pad+yq(key)+': |-'].concat(value.replace(/\r\n/g,'\n').split('\n').map(function(line){ return pad+'  '+line; })).join('\n');
    }
    return pad+yq(key)+': '+yamlValue(value);
  }
  function serializeNode(obj, indent){
    var pad = '  '.repeat(indent);
    var lines = [];
    Object.keys(obj).forEach(function(k){
      var v = obj[k];
      if(v && typeof v === 'object'){
        lines.push(pad + yq(k) + ':');
        lines.push(serializeNode(v, indent+1));
      } else {
        lines.push(serializeValue(k, v, indent));
      }
    });
    return lines.join('\n');
  }
  function isImageField(key){
    return key === 'seoPreviewImage' || key === 'image' || key === 'imageDesktop' || key === 'productImage' || key === 'itemImage'
      || key === 'icon' || key === 'background' || key === 'backgroundImage' || key === 'pictureBg'
      || /^series\d+Image$/.test(key) || /^backgroundSeries\d+$/.test(key);
  }
  function isExportedSystemField(key){ return key==='jcr:primaryType' || key==='mgnl:template'; }
  function isSupportedNode(node){ return Object.prototype.hasOwnProperty.call(TPL_PATH,tplNameOf(node)); }
  function exportNode(node, forceFullWidth){
    function copy(value, key){
      if(!value || typeof value !== 'object'){
        if(isImageField(key)) return '';
        if(forceFullWidth && key==='fullWidth') return true;
        return value;
      }
      var result = Array.isArray(value) ? [] : {};
      Object.keys(value).forEach(function(childKey){
        if(isMeta(childKey) && !isExportedSystemField(childKey)) return;
        result[childKey] = copy(value[childKey], childKey);
      });
      return result;
    }
    return copy(node, '');
  }
  function buildYamlText(){
    var lines = [];
    var slug = STATE.rootKey || 'campaign-slug';
    lines.push(yq(slug) + ':');
    Object.keys(STATE.page).forEach(function(k){
      if(k === 'mainBody' || (STATE.page[k] && typeof STATE.page[k] === 'object') || (isMeta(k) && !isExportedSystemField(k))) return;
      lines.push(serializeValue(k, isImageField(k) ? '' : STATE.page[k], 1));
    });
    lines.push('  ' + yq('mainBody') + ':');
    lines.push('    ' + yq('jcr:primaryType') + ': ' + yq('mgnl:area'));
    STATE.order.filter(function(key){ return !STATE.hidden[key]; }).forEach(function(key){
      lines.push('    ' + yq(key) + ':');
      var node=STATE.mainBody[key];
      lines.push(serializeNode(exportNode(node,isSupportedNode(node)), 3));
    });
    return lines.join('\n') + '\n';
  }
  function collectReferencedPaths(){
    var paths = [];
    function walk(obj){
      Object.keys(obj).forEach(function(k){
        var v = obj[k];
        if(v && typeof v === 'object') walk(v);
        else if(typeof v === 'string' && FILES[v]) paths.push(v);
      });
    }
    Object.keys(STATE.page).forEach(function(key){ if(key !== 'mainBody') walk({value:STATE.page[key]}); });
    STATE.order.filter(function(key){ return !STATE.hidden[key]; }).forEach(function(key){ walk(STATE.mainBody[key]); });
    return paths.filter(function(v,i,a){ return a.indexOf(v)===i; });
  }
  function buildPreviewHtml(remoteMap){
    var preview = document.getElementById('preview').cloneNode(true);
    preview.querySelectorAll('.cmp-actions,.cmp-tag,.pagemeta').forEach(function(el){ el.remove(); });
    var markup = preview.innerHTML;
    Object.keys(assetsMap).forEach(function(path){
      markup = markup.split(assetsMap[path]).join(path);
    });
    if(remoteMap) Object.keys(remoteMap).forEach(function(url){
      markup = markup.split(url).join(remoteMap[url]);
      markup = markup.split(esc(url)).join(remoteMap[url]);
    });
    var styles = Array.prototype.map.call(document.querySelectorAll('style'), function(style){ return style.textContent; }).join('\n');
    var frame = document.getElementById('viewport-frame');
    var accent = frame.getAttribute('data-accent') || '';
    var title = (STATE.page && STATE.page.title) || STATE.rootKey || 'Campaign Preview';
    var carouselScript = "<script>(function(){function step(track){return track.children[1]?track.children[1].offsetLeft-track.children[0].offsetLeft:track.children[0].getBoundingClientRect().width||1;}function setup(dots){var track=document.getElementById(dots.dataset.carouselDots);if(!track||!track.children.length)return;function sync(){var s=step(track),pages=Math.max(1,Math.min(dots.children.length,Math.ceil((track.scrollWidth-track.clientWidth)/s)+1)),active=Math.min(pages-1,Math.round(track.scrollLeft/s)),prev=document.querySelector('[data-carousel-prev=\"'+dots.dataset.carouselDots+'\"]'),next=document.querySelector('[data-carousel-next=\"'+dots.dataset.carouselDots+'\"]');if(prev)prev.disabled=track.scrollLeft<1;if(next)next.disabled=track.scrollLeft>=track.scrollWidth-track.clientWidth-1;dots.hidden=pages<=1;Array.prototype.forEach.call(dots.children,function(dot,i){dot.hidden=i>=pages;dot.classList.toggle('active',i===active);});}track.addEventListener('scroll',sync,{passive:true});requestAnimationFrame(sync);if(window.ResizeObserver)new ResizeObserver(sync).observe(track);}document.querySelectorAll('[data-carousel-dots]').forEach(setup);document.addEventListener('click',function(e){var dot=e.target.closest('[data-carousel-dot]');if(dot){var dots=dot.closest('[data-carousel-dots]'),track=document.getElementById(dots.dataset.carouselDots);if(track)track.scrollTo({left:Math.min(Number(dot.dataset.carouselDot)*step(track),track.scrollWidth-track.clientWidth),behavior:'smooth'});return;}var prev=e.target.closest('[data-carousel-prev]');if(prev){var prevTrack=document.getElementById(prev.dataset.carouselPrev);if(prevTrack)prevTrack.scrollBy({left:-step(prevTrack),behavior:'smooth'});return;}var next=e.target.closest('[data-carousel-next]');if(next){var nextTrack=document.getElementById(next.dataset.carouselNext);if(nextTrack)nextTrack.scrollBy({left:step(nextTrack),behavior:'smooth'});}});})();<\/script>";
    return '<!DOCTYPE html>\n<html lang="'+esc(LANG)+'">\n<head>\n<meta charset="UTF-8">\n'
      +'<meta name="viewport" content="width=device-width,initial-scale=1">\n<title>'+esc(title)+'</title>\n<style>\n'+styles+'\n'
      +'html,body{margin:0;padding:0;background:#fff;} body{min-height:100vh;} img,video{max-width:100%;} #viewport-frame{width:100%!important;max-width:none!important;margin:0;border:0;border-radius:0;box-shadow:none;transform:none!important;} .cmp-actions,.cmp-tag,.pagemeta{display:none!important;}\n'
      +'</style>\n</head>\n<body>\n<div id="viewport-frame" data-accent="'+esc(accent)+'"><div id="preview">'+markup+'</div></div>\n'+carouselScript+'\n</body>\n</html>\n';
  }
  function extFromUrl(url, mime){
    var clean = String(url).split('?')[0].split('#')[0];
    var match = /\.([a-z0-9]+)$/i.exec(clean);
    if(match) return match[1].toLowerCase();
    if(mime && mime.indexOf('/') > 0) return mime.split('/')[1].split('+')[0];
    return 'png';
  }
  function collectImageRefs(){
    var refs = [];
    function walk(container, owner, tpl, itemKey){
      Object.keys(container).forEach(function(key){
        var value = container[key];
        if(value && typeof value === 'object'){ walk(value, owner, tpl, /\d$/.test(key) ? key : itemKey); return; }
        if(typeof value === 'string' && value && isImageField(key)) refs.push({owner:owner, tpl:tpl, field:key, itemKey:itemKey, value:value});
      });
    }
    walk(STATE.page, 'page', 'page', null);
    STATE.order.filter(function(key){ return !STATE.hidden[key]; }).forEach(function(key){
      var node = STATE.mainBody[key];
      if(node && typeof node === 'object') walk(node, key, tplNameOf(node), null);
    });
    return refs;
  }
  document.getElementById('exportBtn').addEventListener('click', function(){
    if(!STATE.mainBody) return;
    var button = this;
    if(button.disabled) return;
    button.disabled = true;
    var slug = STATE.rootKey || 'campaign-slug';
    var zip = new JSZip();
    var assetsFolder = zip.folder('assets');
    collectReferencedPaths().forEach(function(path){
      assetsFolder.file(path.indexOf('assets/') === 0 ? path.slice('assets/'.length) : path, FILES[path]);
    });
    var seen = {}, rewrite = {};
    var remote = collectImageRefs().filter(function(ref){ return /^https?:\/\//i.test(ref.value) && !seen[ref.value] && (seen[ref.value] = true); });
    Promise.all(remote.map(function(ref){
      return fetch(ref.value).then(function(res){
        if(!res.ok) throw new Error('HTTP ' + res.status);
        return res.blob();
      }).then(function(blob){
        var rel = ref.owner + '-' + ref.tpl + '/' + (ref.itemKey ? ref.itemKey + '-' : '') + ref.field + '.' + extFromUrl(ref.value, blob.type);
        assetsFolder.file(rel, blob);
        rewrite[ref.value] = 'assets/' + rel;
      }).catch(function(){
        MISSING.push(ref.value); // unreachable URL stays linked in the preview
      });
    })).then(function(){
      zip.file(slug + '.yaml', buildYamlText());
      zip.file(slug + '-preview.html', buildPreviewHtml(rewrite));
      return zip.generateAsync({type:'blob'});
    }).then(function(blob){
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = slug + '.zip';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }).then(function(){ button.disabled = false; }, function(){ button.disabled = false; });
  });

    document.getElementById('viewport-frame').setAttribute('data-accent',theme==='blue'?'':theme);
    closePageSetup(); beginEditing(); paintPreview();
  });
  document.getElementById('pageSetupCancel').addEventListener('click',closePageSetup);
  document.getElementById('pageSetupModal').addEventListener('click',function(event){ if(event.target.id==='pageSetupModal') closePageSetup(); });
  document.addEventListener('keydown',function(event){ if(event.key==='Escape' && document.getElementById('pageSetupModal').classList.contains('open')) closePageSetup(); });
  document.getElementById('startBlank').addEventListener('click', openPageSetup);
  document.getElementById('startSample').addEventListener('click', loadFullExample);
  document.getElementById('startImport').addEventListener('click', openModal);
  initBlank();
  applyI18n();
